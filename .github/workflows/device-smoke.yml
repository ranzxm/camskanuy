name: Android device smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-and-recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM on CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launch, recreation, and storage on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb shell am start -W -n com.ranzxm.camskanuy/.MainActivity
            adb shell screencap -p /sdcard/camskanuy.png
            adb pull /sdcard/camskanuy.png app/build/reports/camskanuy.png
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-smoke-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 14
